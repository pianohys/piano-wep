<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>학생 작품 감상</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E8; --panel:#fff; --ink:#232842; --ink-soft:#716b5c; --line:#DCD4C2;
    --coral:#E4572E; --teal:#2A9D8F; --amber:#F4C95D;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:22px 16px 60px; }
  .topbar{ margin-bottom:10px; }
  .topbar h1{ font-size:20px; margin:0; }

  .status{ text-align:center; font-size:14px; color:var(--ink-soft); margin:6px 0 14px; min-height:18px; }
  .scoreBox{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; position:relative;
  }
  .scoreBox iframe{ width:100%; border:none; display:block; height:420px; background:#fff; }
  .loadingOverlay{
    position:absolute; inset:0; background:rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft);
  }
  .loadingOverlay[hidden]{ display:none; }
  .manualPlayBtn{
    display:block; margin:16px auto 0; border:none; border-radius:12px; padding:14px 28px;
    font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--amber); color:var(--ink);
  }
  #stopBtn{ background:var(--line); color:var(--ink); }
  .errorNote{ text-align:center; color:var(--coral); font-size:14.5px; padding:30px 10px; }
  .syncAdjust{ margin-top:18px; text-align:center; }
  .syncAdjust[hidden]{ display:none; }
  .syncLabel{ font-size:13px; color:var(--ink-soft); margin:0 0 8px; }
  .syncBtnRow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .syncBtnRow button{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:8px 14px; border-radius:10px; font-size:13.5px; font-family:inherit; cursor:pointer;
  }
  .syncBtnRow button:active{ background:var(--bg); }
  .syncMsg{ font-size:12.5px; color:var(--teal); min-height:16px; margin:6px 0 0; }
  .backLink{ display:block; text-align:center; margin-top:28px; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><h1 id="screenTitle">학생 작품 감상</h1></div>

  <p class="status" id="playStatus">악보를 불러오는 중…</p>
  <p class="status" id="tempoDebug" style="font-size:12px;opacity:.7"></p>
  <div class="scoreBox">
    <iframe id="scoreFrame" title="악보"></iframe>
    <div class="loadingOverlay" id="loadingOverlay">불러오는 중…</div>
  </div>
  <button class="manualPlayBtn" id="manualPlayBtn" hidden>▶ 재생이 안 되면 눌러주세요</button>
  <button class="manualPlayBtn" id="stopBtn" hidden>■ 정지</button>
  <div class="syncAdjust" id="syncAdjust" hidden>
    <p class="syncLabel">시작 지점이 안 맞으면 (지금 보정: <b id="syncVal">0.0</b>초)</p>
    <div class="syncBtnRow">
      <button type="button" id="syncEarlier">◀ 더 일찍</button>
      <button type="button" id="syncLater">더 늦게 ▶</button>
    </div>
    <p class="syncLabel">전체 속도가 안 맞으면 (원래 템포: <b id="origTempoVal">0</b> BPM / 지금 템포: <b id="tempoVal">0</b> BPM)</p>
    <div class="syncBtnRow">
      <button type="button" id="tempoSlower">◀ 더 느리게</button>
      <button type="button" id="tempoFaster">더 빠르게 ▶</button>
    </div>
    <div class="syncBtnRow">
      <button type="button" id="syncSave">💾 이 학생 저장 (시작 지점 + 속도)</button>
    </div>
    <p class="syncMsg" id="syncSaveMsg"></p>
  </div>
  <audio id="voiceAudio" preload="auto" hidden></audio>

  <a class="backLink" href="listen.html">← 전체 학생 목록 보기</a>
</div>

<script>
(function(){
  // ---- 이 링크 하나로 바로 듣기: listen.html처럼 반/학생을 고르는 대신, 주소의 쿼리
  // 파라미터(?audio=드라이브파일ID&link=악보%20공유링크&name=표시할%20이름)만으로 바로
  // "악보+목소리" 재생 화면을 띄움. 작곡하기 앱이 "드라이브로 제출" 직후 이 주소를
  // 자동으로 만들어줌. ----
  const params = new URLSearchParams(location.search);
  const currentStudent = {
    name: params.get('name') || '',
    link: params.get('link') || '',
    audio: params.get('audio') || ''
  };
  if (currentStudent.name) document.getElementById('screenTitle').textContent = currentStudent.name;

  // ---------- 재생 화면 ----------
  const AUDIO_PROXY_URL = 'https://script.google.com/macros/s/AKfycbwWJ6siWaHrKk7EhObLpajb1ywCse2Q3yfPgNKaOBpKKEp0LLTx3UXAqzef19iVLsRGjg/exec';

  const scoreFrame = document.getElementById('scoreFrame');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const playStatus = document.getElementById('playStatus');
  const manualPlayBtn = document.getElementById('manualPlayBtn');
  const stopBtn = document.getElementById('stopBtn');
  const voiceAudio = document.getElementById('voiceAudio');
  const syncAdjust = document.getElementById('syncAdjust');
  const syncVal = document.getElementById('syncVal');
  const tempoVal = document.getElementById('tempoVal');
  const origTempoVal = document.getElementById('origTempoVal');
  const syncSaveMsg = document.getElementById('syncSaveMsg');

  let pollTimer = null;
  let pollDeadline = 0;
  let wantAudio = false;
  let voiceOnsetSec = 0;     // 녹음 파일 안에서 실제 노래가 시작되는 지점(초)
  let currentTempoBPM = 0;   // 지금 악보 재생에 쓰이는 템포(저장된 값 또는 원래 작곡된 템포)
  let syncPollTimer = null;

  function proxyAudioUrl(id){
    return AUDIO_PROXY_URL + '?id=' + encodeURIComponent(id);
  }

  function updateSyncVal(){
    syncVal.textContent = voiceOnsetSec.toFixed(1);
  }
  function updateTempoVal(){
    tempoVal.textContent = currentTempoBPM;
  }

  async function fetchSavedSync(id){
    try{
      // 브라우저가 이 GET 요청을 캐싱하면 저장 직후에도 예전 값을 계속 보여주게 되므로,
      // 매번 다른 URL이 되도록 타임스탬프를 붙이고 캐시를 명시적으로 끔.
      const url = AUDIO_PROXY_URL + '?action=getOffset&id=' + encodeURIComponent(id) + '&_=' + Date.now();
      const res = await fetch(url, {cache: 'no-store'});
      const json = await res.json();
      if (json && json.ok){
        return {
          offset: (json.offset != null && json.offset !== '') ? Number(json.offset) : null,
          tempo: (json.tempo != null && json.tempo !== '') ? Number(json.tempo) : null
        };
      }
    }catch(e){}
    return {offset:null, tempo:null};
  }

  function base64ToArrayBuffer(b64){
    const binStr = atob(b64);
    const bytes = new Uint8Array(binStr.length);
    for (let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
    return bytes.buffer;
  }

  // ---- 학생 목소리 음량을 한결같게: 기기별 볼륨 차이가 큰 녹음을 분석해서, 너무 크거나
  // 너무 작은 아이 없이 비슷한 크기로 들리도록 매번 자동으로 게인을 맞춤(+ 혹시 남는 피크는
  // 아래 리미터가 한 번 더 눌러줌). ----
  const TARGET_RMS = 0.09;
  const GAIN_MIN = 0.35, GAIN_MAX = 2.2;
  let voiceGainNode = null, voiceCompressor = null, voiceSourceLinked = false;

  let voiceCtx = null;
  function ensureVoiceAudioGraph(){
    if (voiceSourceLinked){
      if (voiceCtx && voiceCtx.state !== 'running') voiceCtx.resume().catch(()=>{});
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    voiceCtx = new Ctx();
    voiceCtx.resume().catch(()=>{}); // 일부 브라우저는 만들자마자 suspended 상태라 명시적으로 깨워줘야 함
    const source = voiceCtx.createMediaElementSource(voiceAudio);
    voiceGainNode = voiceCtx.createGain();
    voiceGainNode.gain.value = 1;
    voiceCompressor = voiceCtx.createDynamicsCompressor();
    // 혹시라도 유난히 크게 녹음된 파일이 있어도 귀 아프게 튀지 않도록 안전망으로 한 번 더 눌러줌.
    voiceCompressor.threshold.value = -20;
    voiceCompressor.knee.value = 6;
    voiceCompressor.ratio.value = 10;
    voiceCompressor.attack.value = 0.003;
    voiceCompressor.release.value = 0.15;
    source.connect(voiceGainNode).connect(voiceCompressor).connect(voiceCtx.destination);
    voiceSourceLinked = true;
  }

  // ---- Apps Script 중계기에서 base64로 감싼 음성 파일을 받아서(한 번만 내려받음),
  // 재생 가능한 Blob URL로 만들고, 동시에 "진짜 노래가 시작되는 지점"/전체 음량도
  // 에너지 분석으로 대략 추정함(완벽한 음성인식은 아니고, 조용한 구간 vs 소리 나는
  // 구간을 구분하는 수준의 간단한 추정임). ----
  async function loadAndAnalyzeVoice(id){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000); // 막히지 않도록 최대 15초만 기다림
      let res;
      try{
        res = await fetch(proxyAudioUrl(id), {signal: controller.signal});
      } finally {
        clearTimeout(timeout);
      }
      const json = await res.json();
      if (!json || !json.ok || !json.base64) return {objectUrl:null, onset:0, gain:1};

      const buf = base64ToArrayBuffer(json.base64);
      const blob = new Blob([buf], {type: json.mimeType || 'audio/mpeg'});
      const objectUrl = URL.createObjectURL(blob);

      let onset = 0, gain = 1;
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuf = await ctx.decodeAudioData(buf.slice(0)); // decodeAudioData가 버퍼를 소비하므로 복사본 사용
        const data = audioBuf.getChannelData(0);
        const sr = audioBuf.sampleRate;
        ctx.close();

        const WIN_SEC = 0.02;
        const winSize = Math.floor(sr * WIN_SEC); // 20ms 단위로 에너지 측정
        const numWins = Math.floor(data.length / winSize);
        if (numWins >= 10){
          const rawEnergies = new Float32Array(numWins);
          for (let i=0;i<numWins;i++){
            let sum=0;
            const base=i*winSize;
            for (let j=0;j<winSize;j++){ const v=data[base+j]; sum += v*v; }
            rawEnergies[i] = Math.sqrt(sum/winSize);
          }
          // 5칸(100ms) 이동평균으로 살짝 매끄럽게 함(잡음 깜빡임 줄이기).
          const energies = new Float32Array(numWins);
          const smoothN = 5;
          for (let i=0;i<numWins;i++){
            let s=0, c=0;
            for (let j=Math.max(0,i-smoothN+1); j<=i; j++){ s+=rawEnergies[j]; c++; }
            energies[i] = s/c;
          }

          // 녹음 안에 반주가 처음부터 계속 섞여 있는 경우를 감안해, 아주 초반만 기준으로 삼는 대신
          // "직전 ~1.5초 구간 평균(=그 시점까지의 반주 수준)" 대비 상대적으로 커지는 지점을 찾음 —
          // 목소리가 반주 위에 얹히는 순간을 더 안정적으로 잡아냄.
          const baseWins = Math.round(1.5/WIN_SEC);
          const warmupWins = Math.round(1.0/WIN_SEC);   // 기준선이 충분히 안정되기 전(1초 미만)은 후보에서 제외
          const sustainWins = Math.round(0.8/WIN_SEC);  // 최소 0.8초는 계속 커진 상태여야 진짜 시작으로 인정
          let startWin=-1;
          for (let i=warmupWins;i<numWins;i++){
            const from=Math.max(0, i-baseWins);
            let bsum=0, bcnt=0;
            for (let j=from;j<i;j++){ bsum+=energies[j]; bcnt++; }
            const baseline = bcnt ? bsum/bcnt : 0;
            const rel = Math.max(baseline*1.6, baseline+0.012);
            if (energies[i] > rel){
              let ok=true;
              for (let k=i;k<Math.min(numWins,i+sustainWins);k++){
                if (energies[k] <= Math.max(baseline*1.3, baseline+0.008)){ ok=false; break; }
              }
              if (ok){ startWin=i; break; }
            }
          }
          onset = startWin<0 ? 0 : Math.max(0, startWin*WIN_SEC - 0.1);

          // 실제 노래 구간(시작 지점 이후)만으로 평균 음량을 재서, 앞의 반주만 있는 구간이
          // 평균을 낮춰 보이게 하는 걸 피함.
          const fromWin = startWin<0 ? 0 : startWin;
          let sum=0, cnt=0;
          for (let i=fromWin;i<numWins;i++){ sum += rawEnergies[i]*rawEnergies[i]; cnt++; }
          const rms = cnt ? Math.sqrt(sum/cnt) : 0.09;
          gain = rms>0.0005 ? TARGET_RMS/rms : 1;
          gain = Math.min(GAIN_MAX, Math.max(GAIN_MIN, gain));
        }
      }catch(e){ /* 분석 실패해도 재생 자체는 그대로 진행 */ }

      return {objectUrl, onset, gain};
    }catch(e){
      return {objectUrl:null, onset:0, gain:1};
    }
  }

  // ---- 재생 중인 악기 소리를 음량 0으로(화면/박자만 남기고 묵음) ----
  function muteInstruments(doc){
    ['volMelody','volChord','volBass','volDrum'].forEach(id => {
      const el = doc.getElementById(id);
      if (!el) return;
      el.value = 0;
      el.dispatchEvent(new Event('input', {bubbles:true}));
    });
  }

  function waitForAudioMetadata(){
    return new Promise(resolve => {
      if (voiceAudio.readyState >= 1 && isFinite(voiceAudio.duration)) return resolve();
      const onLoaded = () => { voiceAudio.removeEventListener('loadedmetadata', onLoaded); resolve(); };
      voiceAudio.addEventListener('loadedmetadata', onLoaded, {once:true});
      setTimeout(resolve, 3000); // 메타데이터가 너무 늦게 와도 재생 자체는 막히지 않게 하는 안전장치
    });
  }

  function openPlay(withAudio){
    wantAudio = withAudio && !!currentStudent.audio;
    playStatus.textContent = wantAudio ? '악보와 노래를 함께 준비하는 중…' : '악보를 준비하는 중…';
    manualPlayBtn.hidden = true;
    stopBtn.hidden = true;
    loadingOverlay.hidden = false;
    loadingOverlay.textContent = '불러오는 중…';
    voiceOnsetSec = 0;

    const raw = currentStudent.link || '';
    const hashIdx = raw.indexOf('#');
    if (hashIdx === -1 || !(raw.slice(hashIdx).indexOf('#s=')===0 || raw.slice(hashIdx).indexOf('#d=')===0)){
      loadingOverlay.hidden = true;
      playStatus.textContent = '';
      scoreFrame.src = 'about:blank';
      document.querySelector('.scoreBox').insertAdjacentHTML('beforeend',
        '<p class="errorNote" id="errNote">이 링크에 악보 정보가 없어요. 작곡하기 앱에서 다시 제출해서 새 링크를 받아주세요.</p>');
      return;
    }
    const hash = raw.slice(hashIdx);

    syncAdjust.hidden = true;
    syncSaveMsg.textContent = '';

    const voicePrepPromise = wantAudio
      ? (async () => {
          ensureVoiceAudioGraph();
          const [{objectUrl, onset, gain}, savedSync] = await Promise.all([
            loadAndAnalyzeVoice(currentStudent.audio),
            fetchSavedSync(currentStudent.audio)
          ]);
          // 이전에 "더 일찍/더 늦게"로 맞춰서 저장해둔 값이 있으면, 자동 감지보다 그걸 우선함.
          voiceOnsetSec = savedSync.offset != null ? savedSync.offset : onset;
          updateSyncVal();
          if (voiceGainNode) voiceGainNode.gain.value = gain;
          if (objectUrl) voiceAudio.src = objectUrl;
          return {gotAudio: !!objectUrl, savedTempo: savedSync.tempo};
        })()
      : Promise.resolve({gotAudio: true, savedTempo: null});

    scoreFrame.onload = () => {
      injectCleanView();
      startPolling(voicePrepPromise);
    };
    scoreFrame.src = 'index.html' + hash;
  }

  function injectCleanView(){
    try{
      const doc = scoreFrame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = 'header.top,.palSticky,.accBox,.controls,.savebar,.hint,.how,' +
        '.keymode-row,.studentInfoHint,.chordPickPopup,#floatingStop,#topActions,' +
        '#instrVolRow{display:none!important}' +
        '.wrap{padding:10px 10px 24px!important;max-width:none!important}' +
        '.panel.score{border:none!important;box-shadow:none!important;padding:0!important;margin:0!important}' +
        'body{background:#fff!important}';
      doc.head.appendChild(style);
    }catch(e){ /* 같은 출처가 아니면 조용히 건너뜀 */ }
  }

  function startPolling(voicePrepPromise){
    clearInterval(pollTimer);
    pollDeadline = Date.now() + 15000;
    pollTimer = setInterval(() => checkReady(voicePrepPromise), 200);
    checkReady(voicePrepPromise);
  }

  function checkReady(voicePrepPromise){
    let txt = '';
    try{
      const doc = scoreFrame.contentDocument;
      const statusEl = doc.getElementById('status');
      txt = statusEl ? statusEl.textContent : '';
    }catch(e){}

    if (txt.indexOf('불러왔어요') !== -1){
      clearInterval(pollTimer); pollTimer = null;
      onScoreReady(voicePrepPromise);
      return;
    }
    const failPhrases = ['찾을 수 없어요','불러오지 못했어요','읽지 못했어요'];
    if (failPhrases.some(p => txt.indexOf(p) !== -1)){
      clearInterval(pollTimer); pollTimer = null;
      loadingOverlay.hidden = true;
      playStatus.textContent = '이 악보를 불러오지 못했어요. 링크가 만료됐거나 잘못됐을 수 있어요.';
      return;
    }
    if (Date.now() > pollDeadline){
      clearInterval(pollTimer); pollTimer = null;
      loadingOverlay.hidden = true;
      playStatus.textContent = '불러오는 데 시간이 너무 오래 걸려요. 네트워크 상태를 확인하고 다시 시도해주세요.';
    }
  }

  async function onScoreReady(voicePrepPromise){
    loadingOverlay.hidden = true;
    if (wantAudio){
      // 악기 음소거는 목소리 파일이 준비되길 기다리지 않고 바로 해둠.
      try{ muteInstruments(scoreFrame.contentDocument); }catch(e){}
      playStatus.textContent = '학생 목소리를 불러오는 중…';
      let gotAudio = false, savedTempo = null;
      try{ ({gotAudio, savedTempo} = await voicePrepPromise); }catch(e){}
      if (!gotAudio){
        playStatus.textContent = '학생 목소리를 불러오지 못했어요. 네트워크 상태를 확인하고 다시 시도해주세요.';
        manualPlayBtn.hidden = false;
        return;
      }
      await waitForAudioMetadata();
      const tempoDebug = document.getElementById('tempoDebug');
      try{
        const doc = scoreFrame.contentDocument;
        const tempoEl = doc.getElementById('tempo');
        // 조절하실 때 기준으로 삼을 수 있게, 저장된 값 적용 전의 "원래(작곡된) 템포"를 따로 기억해둠.
        if (tempoEl) origTempoVal.textContent = tempoEl.value;
        // 자동으로 템포를 추정해서 바꾸는 건 꺼둠 — 저장해둔 보정값이 있을 때만 적용하고,
        // 그 외에는 원래 작곡된 템포를 그대로 씀.
        if (savedTempo != null && tempoEl){
          tempoEl.value = savedTempo;
          tempoEl.dispatchEvent(new Event('input', {bubbles:true}));
          currentTempoBPM = savedTempo;
          if (tempoDebug) tempoDebug.textContent = '저장된 템포 사용: ' + savedTempo + ' BPM';
        } else {
          currentTempoBPM = tempoEl ? +tempoEl.value : 0;
          if (tempoDebug) tempoDebug.textContent = '';
        }
        updateTempoVal();
      }catch(e){ if (tempoDebug) tempoDebug.textContent = '템포 보정 오류: ' + e.message; }
      playStatus.textContent = '준비됐어요! 학생 목소리를 재생하고, 노래가 시작되면 악보도 같이 움직일게요.';
      syncAdjust.hidden = false;
      // 목소리는 녹음된 그대로(자르지 않고) 처음부터 재생 — 전주가 녹음에 포함돼 있으면 그대로 들림.
      try{ voiceAudio.currentTime = 0; }catch(e){}
      if (voiceCtx) voiceCtx.resume().catch(()=>{});
      voiceAudio.play().catch(()=>{ playStatus.textContent = '자동 재생이 막혔어요. 아래 버튼을 눌러주세요.'; manualPlayBtn.hidden = false; });
      // 녹음에서 자동 감지한(또는 저장해둔) "진짜 노래 시작 지점"에 맞춰, 그 순간 악보 화면 재생을 시작함.
      scheduleScoreStart(voiceOnsetSec);
    } else {
      playStatus.textContent = '준비됐어요! 재생할게요.';
      triggerPlayback();
    }
    // 브라우저가 자동재생을 막는 경우를 대비해, 재생 시도와 별개로 수동 버튼도 항상 보여줌.
    manualPlayBtn.hidden = false;
    stopBtn.hidden = false;
  }

  function stopPlayback(){
    try{
      const doc = scoreFrame.contentDocument;
      const btn = doc.getElementById('stop');
      if (btn) btn.click();
    }catch(e){}
    clearInterval(syncPollTimer); syncPollTimer = null;
    voiceAudio.pause();
    // 악보 쪽은 항상 처음부터 다시 재생되는 구조라, 같은 자리에서 이어듣기는 못 하고
    // "정지 → 다시 재생"은 둘 다 처음부터 다시 시작하는 것으로 통일함.
    try{ voiceAudio.currentTime = 0; }catch(e){}
    playStatus.textContent = '정지했어요. 다시 들으려면 위 버튼("재생이 안 되면 눌러주세요")을 눌러주세요.';
  }
  stopBtn.addEventListener('click', stopPlayback);

  function triggerPlayback(){
    try{
      const doc = scoreFrame.contentDocument;
      const btn = doc.getElementById('playnomet');
      if (btn) btn.click();
    }catch(e){
      manualPlayBtn.hidden = false;
    }
  }

  // 목소리 재생 위치가 감지된 "노래 시작 지점"에 닿는 순간 악보(화면)만 재생을 시작함.
  function scheduleScoreStart(delaySec){
    clearInterval(syncPollTimer); syncPollTimer = null;
    if (!delaySec || delaySec <= 0.05){
      triggerPlayback();
      return;
    }
    syncPollTimer = setInterval(() => {
      if (voiceAudio.currentTime >= delaySec || voiceAudio.ended){
        clearInterval(syncPollTimer); syncPollTimer = null;
        triggerPlayback();
      }
    }, 50);
  }

  manualPlayBtn.addEventListener('click', () => {
    if (wantAudio){
      try{ muteInstruments(scoreFrame.contentDocument); }catch(e){}
      if (voiceCtx) voiceCtx.resume().catch(()=>{});
      if (voiceAudio.src){
        voiceAudio.play().catch(()=>{});
        scheduleScoreStart(voiceOnsetSec);
        return;
      }
    }
    triggerPlayback();
  });

  // ---- "◀ 더 일찍 / 더 늦게 ▶": 들으면서 바로 맞춰볼 수 있는 보정 버튼. 처음부터 다시
  // 재생해서 바뀐 타이밍을 바로 확인할 수 있게 함 ----
  function restartTogetherPlayback(){
    if (!wantAudio || !voiceAudio.src) return;
    try{
      const doc = scoreFrame.contentDocument;
      const stopBtn2 = doc.getElementById('stop');
      if (stopBtn2) stopBtn2.click();
      muteInstruments(doc);
    }catch(e){}
    clearInterval(syncPollTimer); syncPollTimer = null;
    try{ voiceAudio.currentTime = 0; }catch(e){}
    if (voiceCtx) voiceCtx.resume().catch(()=>{});
    voiceAudio.play().catch(()=>{});
    scheduleScoreStart(voiceOnsetSec);
  }
  document.getElementById('syncEarlier').addEventListener('click', () => {
    voiceOnsetSec = Math.max(0, voiceOnsetSec - 0.3);
    updateSyncVal();
    syncSaveMsg.textContent = '';
    restartTogetherPlayback();
  });
  document.getElementById('syncLater').addEventListener('click', () => {
    voiceOnsetSec = voiceOnsetSec + 0.3;
    updateSyncVal();
    syncSaveMsg.textContent = '';
    restartTogetherPlayback();
  });
  function nudgeTempo(delta){
    currentTempoBPM = Math.min(140, Math.max(50, currentTempoBPM + delta));
    updateTempoVal();
    try{
      const tempoEl = scoreFrame.contentDocument.getElementById('tempo');
      if (tempoEl){
        tempoEl.value = currentTempoBPM;
        tempoEl.dispatchEvent(new Event('input', {bubbles:true}));
      }
    }catch(e){}
    syncSaveMsg.textContent = '';
    restartTogetherPlayback();
  }
  document.getElementById('tempoSlower').addEventListener('click', () => nudgeTempo(-3));
  document.getElementById('tempoFaster').addEventListener('click', () => nudgeTempo(3));

  document.getElementById('syncSave').addEventListener('click', async () => {
    if (!currentStudent.audio) return;
    syncSaveMsg.textContent = '저장 중…';
    try{
      const url = AUDIO_PROXY_URL + '?action=saveOffset&id=' + encodeURIComponent(currentStudent.audio) +
        '&offset=' + encodeURIComponent(voiceOnsetSec.toFixed(2)) +
        '&tempo=' + encodeURIComponent(currentTempoBPM) + '&_=' + Date.now();
      const res = await fetch(url, {cache: 'no-store'});
      const json = await res.json();
      syncSaveMsg.textContent = (json && json.ok)
        ? (voiceOnsetSec.toFixed(1) + '초 / ' + currentTempoBPM + 'BPM으로 저장했어요! 다음부터 이 링크는 이 타이밍으로 재생돼요.')
        : ('저장하지 못했어요: ' + ((json && json.error) || '다시 시도해주세요.'));
    }catch(e){
      syncSaveMsg.textContent = '저장하지 못했어요. 다시 시도해주세요.';
    }
  });

  if (!currentStudent.link){
    loadingOverlay.hidden = true;
    playStatus.textContent = '';
    document.querySelector('.scoreBox').insertAdjacentHTML('beforeend',
      '<p class="errorNote">이 링크에 악보 정보가 없어요. 작곡하기 앱에서 다시 제출해서 새 링크를 받아주세요.</p>');
  } else {
    openPlay(!!currentStudent.audio);
  }
})();
</script>
</body>
</html>
