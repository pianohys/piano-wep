<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상 피아노</title>
<style>
  :root{
    --bg1:#1e1b2e;
    --bg2:#2d2645;
    --accent:#7c6cf5;
    --accent2:#f5a623;
    --white-key:#fdfdfd;
    --white-key-active:#c9c2ff;
    --black-key:#1a1a1a;
    --black-key-active:#7c6cf5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:"Segoe UI","Malgun Gothic",sans-serif;
    background:radial-gradient(circle at top, var(--bg2), var(--bg1));
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    user-select:none;
  }
  h1{
    margin:20px 0 4px;
    font-size:1.6rem;
    letter-spacing:2px;
    text-shadow:0 0 20px var(--accent);
  }
  .sub{
    color:#b8b0e0;
    font-size:0.85rem;
    margin-bottom:16px;
    text-align:center;
    padding:0 16px;
  }
  .panel{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:12px 20px;
    margin-bottom:22px;
    backdrop-filter:blur(6px);
  }
  .panel label{
    font-size:0.8rem;
    color:#cfc8ff;
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:center;
  }
  .panel select, .panel button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-size:0.85rem;
    cursor:pointer;
    transition:transform .1s, background .2s;
  }
  .panel button:hover, .panel select:hover{ background:#6353e0; }
  .panel button:active{ transform:scale(0.94); }
  .panel button.toggle-on{ background:var(--accent2); color:#2b1a00; }
  input[type=range]{ accent-color:var(--accent); }

  .piano-wrap{
    width:100%;
    max-width:1100px;
    overflow-x:auto;
    padding:0 10px 30px;
  }
  .piano{
    position:relative;
    display:flex;
    height:220px;
    margin:0 auto;
    width:max-content;
    filter:drop-shadow(0 10px 25px rgba(0,0,0,0.5));
  }
  .white-key{
    position:relative;
    width:58px;
    height:220px;
    background:linear-gradient(to bottom, var(--white-key), #e8e5f5);
    border:1px solid #999;
    border-radius:0 0 8px 8px;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.08);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:10px;
    cursor:pointer;
    transition:background .05s;
    z-index:1;
  }
  .white-key.active{
    background:linear-gradient(to bottom, var(--white-key-active), #a89bff);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.25);
    transform:translateY(2px);
  }
  .black-key{
    position:absolute;
    top:0;
    width:36px;
    height:135px;
    background:linear-gradient(to bottom, #2a2a2a, var(--black-key));
    border-radius:0 0 6px 6px;
    z-index:2;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    cursor:pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    transition:background .05s;
  }
  .black-key.active{
    background:linear-gradient(to bottom, var(--black-key-active), #4a3fbd);
    transform:translateY(2px);
  }
  footer{
    color:#7a72a3;
    font-size:0.75rem;
    margin:10px 0 24px;
    text-align:center;
    padding:0 16px;
  }
</style>
</head>
<body>

<h1>🎹 가상 피아노</h1>
<p class="sub">마우스로 건반을 클릭하거나 컴퓨터 키보드(A~; 흰건반, W E T Y U 검은건반)를 눌러 연주하세요.</p>

<div class="panel">
  <label>음색
    <select id="waveform">
      <option value="triangle">피아노 느낌 (기본)</option>
      <option value="sine">부드러운 소리</option>
      <option value="sawtooth">선명한 소리</option>
      <option value="square">칩튠 소리</option>
    </select>
  </label>
  <label>옥타브
    <div style="display:flex;gap:6px;align-items:center;">
      <button id="octDown">−</button>
      <span id="octLabel">4</span>
      <button id="octUp">+</button>
    </div>
  </label>
  <label>음량
    <input type="range" id="volume" min="0" max="100" value="70">
  </label>
  <label>서스테인
    <button id="sustainBtn">OFF</button>
  </label>
  <label>&nbsp;
    <button id="recBtn">● 녹음</button>
  </label>
  <label>&nbsp;
    <button id="playBtn" disabled>▶ 재생</button>
  </label>
</div>

<div class="piano-wrap">
  <div class="piano" id="piano"></div>
</div>

<footer>Web Audio API 기반 · 데이터는 저장되지 않으며 브라우저 내에서만 동작합니다.</footer>

<script>
(function(){
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(ctx.destination);

  // Note layout for one octave (white keys with black key offsets)
  // C D E F G A B, black keys after C D F G A (not E, B)
  const whiteNotes = ['C','D','E','F','G','A','B'];
  const blackNotes = {'C':'C#','D':'D#','F':'F#','G':'G#','A':'A#'};

  const keyboardMap = {
    // white keys
    'a':'C', 's':'D', 'd':'E', 'f':'F', 'g':'G', 'h':'A', 'j':'B', 'k':'C1',
    // black keys
    'w':'C#', 'e':'D#', 't':'F#', 'y':'G#', 'u':'A#'
  };

  let baseOctave = 4;
  const octLabel = document.getElementById('octLabel');
  const activeOscillators = {}; // key: note+octave -> {osc, gain}
  let sustain = false;
  let waveform = 'triangle';

  function noteToFreq(note, octave){
    const noteIndex = {
      'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11
    };
    const n = noteIndex[note];
    const midi = (octave + 1) * 12 + n;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function playNote(id, note, octave){
    if(activeOscillators[id]) return;
    const freq = noteToFreq(note, octave);
    const osc = ctx.createOscillator();
    osc.type = waveform;
    osc.frequency.value = freq;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.015);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();

    activeOscillators[id] = {osc, gain};

    if(recording){
      recordEvent('on', note, octave);
    }
  }

  function stopNote(id, note, octave){
    const entry = activeOscillators[id];
    if(!entry) return;
    delete activeOscillators[id];

    const release = sustain ? 1.2 : 0.25;
    entry.gain.gain.cancelScheduledValues(ctx.currentTime);
    entry.gain.gain.setValueAtTime(entry.gain.gain.value, ctx.currentTime);
    entry.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + release);
    entry.osc.stop(ctx.currentTime + release + 0.05);

    if(recording){
      recordEvent('off', note, octave);
    }
  }

  // Build piano UI: 2 octaves
  const piano = document.getElementById('piano');
  const WHITE_W = 58;

  function buildPiano(octaves){
    piano.innerHTML = '';
    let whiteIndex = 0;
    octaves.forEach(oct => {
      whiteNotes.forEach(note => {
        const key = document.createElement('div');
        key.className = 'white-key';
        key.dataset.note = note;
        key.dataset.octave = oct;
        piano.appendChild(key);

        if(blackNotes[note]){
          const bnote = blackNotes[note];
          const bkey = document.createElement('div');
          bkey.className = 'black-key';
          bkey.dataset.note = bnote;
          bkey.dataset.octave = oct;
          bkey.style.left = (whiteIndex * WHITE_W + WHITE_W - 18) + 'px';
          piano.appendChild(bkey);
        }
        whiteIndex++;
      });
    });
    piano.style.width = (whiteIndex * WHITE_W) + 'px';
  }

  buildPiano([3,4,5]);

  function keyId(note, octave){ return note + octave; }

  function pointerDown(el){
    const note = el.dataset.note;
    const octave = parseInt(el.dataset.octave, 10);
    el.classList.add('active');
    playNote(keyId(note, octave), note, octave);
  }
  function pointerUp(el){
    const note = el.dataset.note;
    const octave = parseInt(el.dataset.octave, 10);
    el.classList.remove('active');
    stopNote(keyId(note, octave), note, octave);
  }

  let mouseIsDown = false;
  document.addEventListener('mousedown', () => mouseIsDown = true);
  document.addEventListener('mouseup', () => {
    mouseIsDown = false;
    piano.querySelectorAll('.active').forEach(el => pointerUp(el));
  });

  piano.addEventListener('mousedown', e => {
    const key = e.target.closest('.white-key,.black-key');
    if(!key) return;
    if(ctx.state === 'suspended') ctx.resume();
    pointerDown(key);
  });
  piano.addEventListener('mouseover', e => {
    if(!mouseIsDown) return;
    const key = e.target.closest('.white-key,.black-key');
    if(!key || key.classList.contains('active')) return;
    pointerDown(key);
  });
  piano.addEventListener('mouseout', e => {
    const key = e.target.closest('.white-key,.black-key');
    if(!key) return;
    if(!mouseIsDown) return;
  });
  piano.addEventListener('mouseup', e => {
    const key = e.target.closest('.white-key,.black-key');
    if(key) pointerUp(key);
  });

  // touch support
  piano.addEventListener('touchstart', e => {
    if(ctx.state === 'suspended') ctx.resume();
    for(const t of e.changedTouches){
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const key = el && el.closest('.white-key,.black-key');
      if(key) pointerDown(key);
    }
    e.preventDefault();
  }, {passive:false});
  piano.addEventListener('touchend', e => {
    for(const t of e.changedTouches){
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const key = el && el.closest('.white-key,.black-key');
      if(key) pointerUp(key);
    }
    piano.querySelectorAll('.active').forEach(el => pointerUp(el));
    e.preventDefault();
  }, {passive:false});

  // Computer keyboard support
  const heldKeys = new Set();
  window.addEventListener('keydown', e => {
    if(e.repeat) return;
    const k = e.key.toLowerCase();
    if(!keyboardMap[k] || heldKeys.has(k)) return;
    heldKeys.add(k);
    if(ctx.state === 'suspended') ctx.resume();

    let note = keyboardMap[k];
    let octave = baseOctave;
    if(note === 'C1'){ note = 'C'; octave = baseOctave + 1; }

    const selector = `[data-note="${note}"][data-octave="${octave}"]`;
    const el = piano.querySelector(selector);
    if(el) pointerDown(el);
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if(!keyboardMap[k]) return;
    heldKeys.delete(k);

    let note = keyboardMap[k];
    let octave = baseOctave;
    if(note === 'C1'){ note = 'C'; octave = baseOctave + 1; }

    const selector = `[data-note="${note}"][data-octave="${octave}"]`;
    const el = piano.querySelector(selector);
    if(el) pointerUp(el);
  });

  // Controls
  document.getElementById('waveform').addEventListener('change', e => {
    waveform = e.target.value;
  });
  document.getElementById('volume').addEventListener('input', e => {
    masterGain.gain.value = e.target.value / 100;
  });
  const sustainBtn = document.getElementById('sustainBtn');
  sustainBtn.addEventListener('click', () => {
    sustain = !sustain;
    sustainBtn.textContent = sustain ? 'ON' : 'OFF';
    sustainBtn.classList.toggle('toggle-on', sustain);
  });
  document.getElementById('octUp').addEventListener('click', () => {
    if(baseOctave < 6){ baseOctave++; octLabel.textContent = baseOctave; }
  });
  document.getElementById('octDown').addEventListener('click', () => {
    if(baseOctave > 2){ baseOctave--; octLabel.textContent = baseOctave; }
  });

  // Simple record & playback
  let recording = false;
  let recordedEvents = [];
  let recordStartTime = 0;
  const recBtn = document.getElementById('recBtn');
  const playBtn = document.getElementById('playBtn');

  function recordEvent(type, note, octave){
    recordedEvents.push({type, note, octave, t: ctx.currentTime - recordStartTime});
  }

  recBtn.addEventListener('click', () => {
    recording = !recording;
    if(recording){
      recordedEvents = [];
      recordStartTime = ctx.currentTime;
      recBtn.textContent = '■ 정지';
      recBtn.classList.add('toggle-on');
      playBtn.disabled = true;
    } else {
      recBtn.textContent = '● 녹음';
      recBtn.classList.remove('toggle-on');
      playBtn.disabled = recordedEvents.length === 0;
    }
  });

  playBtn.addEventListener('click', () => {
    if(recordedEvents.length === 0) return;
    playBtn.disabled = true;
    recBtn.disabled = true;
    recordedEvents.forEach(ev => {
      setTimeout(() => {
        const id = keyId(ev.note, ev.octave);
        const el = piano.querySelector(`[data-note="${ev.note}"][data-octave="${ev.octave}"]`);
        if(ev.type === 'on'){
          if(el) el.classList.add('active');
          playNote(id, ev.note, ev.octave);
        } else {
          if(el) el.classList.remove('active');
          stopNote(id, ev.note, ev.octave);
        }
      }, ev.t * 1000);
    });
    const totalTime = recordedEvents[recordedEvents.length - 1].t * 1000 + 500;
    setTimeout(() => {
      playBtn.disabled = false;
      recBtn.disabled = false;
    }, totalTime);
  });

})();
</script>
</body>
</html>
